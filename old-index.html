<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>سماء فون — المتجر</title>
<style>
  :root{
    --bg:#F5F8FF; --card:#FFFFFF; --text:#1A2138; --muted:#8B9BB4;
    --primary:#1B8EF8; --border:#E2E8F0; --green:#25D366; --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0E1420; --card:#182234; --text:#E7ECF5; --muted:#93A1BC; --primary:#3DA9FF; --border:#2A3852; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI",Tahoma,Arial,sans-serif; }
  header{ position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--border);
    padding:14px 16px; display:flex; align-items:center; gap:10px; z-index:5; }
  header .logo{ font-size:22px; font-weight:800; color:var(--primary); }
  header .sub{ font-size:12px; color:var(--muted); }
  .wa{ margin-inline-start:auto; background:var(--green); color:#fff; text-decoration:none;
    padding:8px 14px; border-radius:12px; font-weight:700; font-size:14px; }
  .wrap{ max-width:1100px; margin:0 auto; padding:16px; }
  .search{ width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:12px;
    background:var(--card); color:var(--text); font-size:15px; margin-bottom:14px; }
  .cats{ display:flex; gap:10px; overflow-x:auto; padding-bottom:8px; margin-bottom:14px; }
  .cat{ flex:0 0 auto; background:var(--card); border:1px solid var(--border); border-radius:999px;
    padding:8px 16px; cursor:pointer; font-weight:600; font-size:14px; white-space:nowrap; }
  .cat.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
  .p{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; }
  .p img{ width:100%; height:150px; object-fit:cover; background:var(--border); }
  .p .noimg{ width:100%; height:150px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:40px; background:var(--border); }
  .p .body{ padding:10px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .p .name{ font-weight:700; font-size:14px; line-height:1.4; }
  .p .price{ color:var(--primary); font-weight:800; font-size:16px; }
  .p .stock{ font-size:12px; }
  .p .in{ color:#059669; } .p .out{ color:#EF4444; }
  .p .order{ margin-top:auto; background:var(--green); color:#fff; border:none; border-radius:10px;
    padding:9px; font-weight:700; cursor:pointer; font-size:13px; }
  .p .order:disabled{ background:var(--muted); cursor:not-allowed; }
  .empty,.loading{ text-align:center; color:var(--muted); padding:50px 0; font-size:16px; }
  footer{ text-align:center; color:var(--muted); font-size:12px; padding:24px 16px 40px; }
</style>
</head>
<body>
  <header>
    <div>
      <div class="logo">سماء فون</div>
      <div class="sub">متجر الجوالات والإلكترونيات</div>
    </div>
    <a class="wa" style="background:var(--primary); margin-inline-start:auto;" href="/store.html">🔑 دخول / حسابي</a>
    <a class="wa" id="waTop" href="#" style="margin-inline-start:8px;">واتساب</a>
  </header>

  <div class="wrap">
    <input class="search" id="search" placeholder="ابحث عن منتج…" />
    <div class="cats" id="cats"></div>
    <div id="content"><div class="loading">جارٍ تحميل المنتجات…</div></div>
  </div>

  <footer>سماء فون — جميع الحقوق محفوظة · <a href="mailto:a.alfeel50@gmail.com" style="color:var(--primary)">a.alfeel50@gmail.com</a> · <a href="/privacy.html" style="color:var(--primary)">سياسة الخصوصية</a></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // إعداد Firebase العام (آمن للتضمين) — نفس مشروع التطبيق.
  const firebaseConfig = {
    apiKey: "AIzaSyC4lo_pPVVA_ixAIybhNKwlLbReKr308eQ",
    authDomain: "sama-phone.firebaseapp.com",
    projectId: "sama-phone",
    storageBucket: "sama-phone.firebasestorage.app",
    messagingSenderId: "887727148149",
    appId: "1:887727148149:android:e74244d6a6ed5092eabc3c"
  };
  const WHATSAPP = "967783454544";
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const state = { products:[], categories:[], activeCat:"all", search:"" };
  const el = (id)=>document.getElementById(id);
  el("waTop").href = "https://wa.me/"+WHATSAPP;

  function fmt(n){ return (n||0).toLocaleString("en-US"); }

  function orderMsg(p){
    return "مرحباً، أريد الطلب:\n📦 "+p.nameAr+"\n💵 السعر: "+fmt(p.price)+" ر.ي\n"+
      (p.specs? "📋 المواصفات: "+p.specs+"\n":"");
  }

  function render(){
    const c = el("content");
    let list = state.products.filter(p=>p.status==="approved");
    if(state.activeCat!=="all") list = list.filter(p=>p.categoryId===state.activeCat);
    if(state.search.trim()){
      const q = state.search.trim();
      list = list.filter(p=>(p.nameAr||"").includes(q)||(p.descriptionAr||"").includes(q));
    }
    if(!list.length){ c.innerHTML='<div class="empty">لا توجد منتجات مطابقة.</div>'; return; }
    c.innerHTML='<div class="grid">'+list.map(p=>{
      const inStock = p.inStock!==false;
      // نعرض الصورة فقط إن كانت رابطًا صالحًا للويب (http/https/data)؛
      // صور المسار المحلي file:// لا تظهر في المتصفح فنعرض بديلًا.
      const validImg = p.imageUri && /^(https?:|data:)/.test(p.imageUri);
      const img = validImg ? '<img src="'+p.imageUri+'" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'noimg\',textContent:\'📱\'}))">' : '<div class="noimg">📱</div>';
      return '<div class="p">'+img+
        '<div class="body">'+
          '<div class="name">'+escapeHtml(p.nameAr||"")+'</div>'+
          '<div class="price">'+fmt(p.price)+' ر.ي</div>'+
          '<div class="stock '+(inStock?"in":"out")+'">'+(inStock?"✔ متوفر":"غير متوفر")+'</div>'+
          '<button class="order" '+(inStock?"":"disabled")+' data-id="'+p.id+'">طلب عبر واتساب</button>'+
        '</div></div>';
    }).join('')+'</div>';
    c.querySelectorAll(".order").forEach(b=>b.onclick=()=>{
      const p = state.products.find(x=>x.id===b.dataset.id);
      if(p) window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(orderMsg(p)),"_blank");
    });
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function renderCats(){
    const seed = [{id:"all",nameAr:"الكل"}].concat(state.categories);
    el("cats").innerHTML = seed.map(cat=>
      '<div class="cat '+(state.activeCat===cat.id?"active":"")+'" data-id="'+cat.id+'">'+escapeHtml(cat.nameAr)+'</div>'
    ).join('');
    el("cats").querySelectorAll(".cat").forEach(x=>x.onclick=()=>{ state.activeCat=x.dataset.id; renderCats(); render(); });
  }

  // الأقسام من settings/categories (نفس التطبيق)
  db.collection("settings").doc("categories").get().then(d=>{
    const items = (d.data()||{}).items || [];
    state.categories = items.map(c=>({id:c.id,nameAr:c.nameAr}));
    renderCats();
  }).catch(()=>renderCats());

  // المنتجات المعتمدة لحظيًا (نفس التطبيق)
  db.collection("products").where("status","==","approved").onSnapshot(snap=>{
    state.products = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    render();
  }, err=>{
    el("content").innerHTML='<div class="empty">تعذّر تحميل المنتجات.<br>'+escapeHtml(err.message||"")+'</div>';
  });

  el("search").oninput = (e)=>{ state.search = e.target.value; render(); };
</script>
</body>
</html>
